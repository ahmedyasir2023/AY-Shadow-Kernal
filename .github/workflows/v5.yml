name: AY Shadow V5 RC1 - security compatibility build
on:
  push:
    branches: [v5-dev]
    paths:
      - "build_v5.sh"
      - "scripts/v5_*.py"
      - "scripts/compat_patch.py"
      - ".github/workflows/v5.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v5-security-build
  cancel-in-progress: true
jobs:
  source-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Checkout AY Shadow V5
        uses: actions/checkout@v4
      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 make bc bison flex libssl-dev libelf-dev libncurses-dev ccache zip
      - name: Compile fingerprint compatible V5 with Seccomp Filter
        env:
          BUILD_JOBS: "4"
        run: bash ./build_v5.sh
      - name: Upload V5 experimental kernel and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AY-Shadow-V5-RC1-NOT-FLASHABLE
          path: |
            dist/v5/
            work/v5-build.log
          if-no-files-found: warn
          retention-days: 14
