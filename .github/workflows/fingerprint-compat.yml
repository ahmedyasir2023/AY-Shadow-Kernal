name: Fingerprint compatible kernel - experimental
on:
  push:
    branches:
      - fingerprint-compat
    paths:
      - "scripts/compat_*.py"
      - "build_compat.sh"
      - ".github/workflows/fingerprint-compat.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      BUILD_JOBS: "4"
    steps:
      - name: Checkout AY Shadow compat
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 make bc bison flex libssl-dev libelf-dev libncurses-dev ccache zip
      - name: Build fingerprint compatible kernel and verify root versions
        run: bash ./build_compat.sh
      - name: Upload untested image, configuration and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AY-Shadow-FP-Compat-EXPERIMENTAL
          path: |
            dist/compat/
            work/compat-build.log
          if-no-files-found: warn
          retention-days: 14
